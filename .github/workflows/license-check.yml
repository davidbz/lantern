name: license-check

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  go-licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Fails on licenses classified as forbidden (e.g. AGPL, SSPL, BUSL) or restricted (GPL, LGPL).
      # Tune DISALLOWED_LICENSES in the Makefile.
      - name: Check licenses
        run: make licenses

      - name: License report
        if: always()
        run: go tool go-licenses report ./... > licenses.csv

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: license-report
          path: licenses.csv
          retention-days: 30
